<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
    <title id="title">Yet Another File Manager</title>

    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient>
    </defs>

    <!-- App tile -->
    <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#background)"/>

    <!-- Folder tab, then body: the overlap reads as one silhouette -->
    <rect x="60" y="82" width="96" height="40" rx="14" fill="#dbeafe" fill-opacity="0.92"/>
    <rect x="60" y="100" width="136" height="78" rx="20" fill="#f8fafc" fill-opacity="0.98"/>

    <!-- Accent line keeps the folder readable at small sizes -->
    <rect x="84" y="134" width="88" height="10" rx="5" fill="#6366f1"/>
</svg>
