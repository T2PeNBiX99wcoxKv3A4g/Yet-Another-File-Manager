[package]
name = "yafm-shell"
version = "0.1.0"
edition = "2021"

# The Windows 11 File Explorer command. It is loaded by the shell's COM surrogate, so it is a
# separate DLL from yafm_native and only exists on Windows.
[lib]
name = "yafm_shell"
crate-type = ["cdylib"]

[dependencies]
# The implement macro writes its own fully qualified paths.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
