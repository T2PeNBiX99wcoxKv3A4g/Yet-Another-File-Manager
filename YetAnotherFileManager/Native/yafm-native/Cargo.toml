[package]
name = "yafm-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "yafm-shellmenu"
path = "src/bin/shellmenu.rs"

[dependencies]
crc32fast = "1"
flate2 = "1"
ignore = "0.4"
rayon = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
# The decoders for the picture formats Windows has no thumbnail provider for: a PSD's embedded
# preview, TGA and DDS textures, HDR/EXR renders, and the BMP a DIB is rebuilt into.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "hdr",
    "jpeg",
    "png",
    "tga",
] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "aes256", "util"] }
base64 = "0.23"
# The XZ method inside a ZIP, which 7-Zip writes and Windows cannot, plus the other methods and
# the encryption the managed writer cannot produce.
zip = { version = "9", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate-flate2",
    "lzma",
    "ppmd",
    "xz",
] }
# JPEG XL: the format's own decoder, which hands its frames over as an image::DynamicImage.
jxl-oxide = { version = "0.12.6", features = ["image"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Writes the version block and the manifest into the DLL, which heuristics read.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
