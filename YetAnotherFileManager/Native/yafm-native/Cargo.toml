[package]
name = "yafm-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "yafm-shellmenu"
path = "src/bin/shellmenu.rs"

[dependencies]
crc32fast = "1"
flate2 = "1"
ignore = "0.4"
rayon = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "aes256", "util"] }
base64 = "0.22"
# The XZ method inside a ZIP, which 7-Zip writes and Windows cannot, plus the other methods and
# the encryption the managed writer cannot produce.
zip = { version = "9", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate-flate2",
    "lzma",
    "ppmd",
    "xz",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
