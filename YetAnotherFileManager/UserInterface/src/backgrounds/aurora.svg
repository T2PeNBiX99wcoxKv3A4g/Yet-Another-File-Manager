            <stop offset="0" stop-color="#08122a"/>
            <stop offset="0.55" stop-color="#101f4a"/>
            <stop offset="1" stop-color="#060a18"/>
        </linearGradient>
        <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
