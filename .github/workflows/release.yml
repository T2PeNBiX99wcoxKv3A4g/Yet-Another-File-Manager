name: Release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dev/**"
      - "dependabot/**"
    paths-ignore:
      - "README.md"
      - "README.*.md"
      - "Site/**"
      - "Windhawk/**"
      - ".gitignore"
      - "LICENSE*"
      - ".github/workflows/dependabot-auto-merge.yml"
      - ".github/workflows/site.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/csharp_release.yml@main
    with:
      project_path: './YetAnotherFileManager/YetAnotherFileManager.csproj'
      filename: 'YetAnotherFileManager'
      dotnet_version: '11.0.x'
      runtimes: '["win-x64", "linux-x64"]'
      version_file_path: './YetAnotherFileManager/YetAnotherFileManager.csproj'
      msi_script: 'installer/windows/build-msi.ps1'
      rpm_script: 'installer/linux/build-rpm.sh'
      deb_script: 'installer/linux/build-deb.sh'
      arch_script: 'installer/linux/build-arch.sh'
    secrets: inherit
