# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # The C# backend — YetAnotherFileManager/YetAnotherFileManager.csproj
  - package-ecosystem: nuget
    directory: /YetAnotherFileManager
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The Rust helper — YetAnotherFileManager/Native/yafm-native/Cargo.toml
  # Its lockfile is committed, so the whole dependency graph is covered. Rust treats a minor bump
  # of a 0.x crate as breaking, so a red build right after such a PR is expected; it is fixed in
  # the same branch rather than blocking the update.
  - package-ecosystem: cargo
    directory: /YetAnotherFileManager/Native/yafm-native
    schedule:
      interval: daily
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The React interface — YetAnotherFileManager/UserInterface/package.json
  # No lockfile is committed on purpose, so this only covers direct dependencies.
  - package-ecosystem: npm
    directory: /YetAnotherFileManager/UserInterface
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The site — Site/package.json
  - package-ecosystem: npm
    directory: /Site
    schedule:
      interval: daily
    groups:
      site-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The workflow files — .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
